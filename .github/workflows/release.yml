name: Release

# Releases happen when master's package.json has a version with no tag yet (the workflow then
# creates the tag), or when a version tag (e.g. v2.3.0) is pushed. Either way it publishes:
#   - a GitHub release with the .vsix attached;
#   - the VS Code Marketplace, if the VSCE_PAT secret is set;
#   - Open VSX, if the OVSX_PAT secret is set.
# Sublime Text users get the release from Package Control via the tag. Re-running the workflow
# (e.g. after adding a missing secret) publishes again; already-published steps are skipped.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Decide whether to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} doesn't match package.json version $version"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # the commit an existing tag points to (the peeled ^{} line for annotated tags)
            tagged=$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}" | sort -k2 | tail -n 1 | cut -f1)
            if [ -z "$tagged" ] || [ "$tagged" = "$GITHUB_SHA" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$version was already released from another commit; bump the version to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Build
        if: steps.version.outputs.release == 'true'
        run: |
          npm ci
          npx --yes @vscode/vsce@3 package
      - name: GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes=$(python3 - <<'PY'
          import re
          text = open("CHANGELOG.md").read()
          m = re.search(r"^## .*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else "")
          PY
          )
          # the release may already exist if it was created from GitHub's web UI (which creates the tag)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.vsix --clobber
          else
            # creates the tag at this commit if it doesn't exist yet
            gh release create "$TAG" *.vsix --target "$GITHUB_SHA" --title "$TAG" --notes "$notes"
          fi
      - name: Publish to the VS Code Marketplace
        if: steps.version.outputs.release == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::warning::VSCE_PAT secret not set; skipping the VS Code Marketplace"; exit 0; fi
          npx --yes @vscode/vsce@3 publish --skip-duplicate --packagePath *.vsix
      - name: Publish to Open VSX
        if: steps.version.outputs.release == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::OVSX_PAT secret not set; skipping Open VSX"; exit 0; fi
          npx --yes ovsx@0 publish --skip-duplicate *.vsix
