name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Language server (Python ${{ matrix.python }}, ${{ matrix.os }}, ${{ matrix.deps }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        deps: [installed]
        include:
          - {os: windows-latest, python: "3.12", deps: installed}
          - {os: macos-latest, python: "3.12", deps: installed}
          # only Coconut installed: jedi/pyflakes come from the bundle shipped in the VS Code extension
          - {os: ubuntu-latest, python: "3.10", deps: bundled}
          - {os: ubuntu-latest, python: "3.14", deps: bundled}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "bundled" ]; then
            python -m pip install coconut pytest pytest-timeout
            python scripts/vendor.py
          else
            python -m pip install -r server/requirements.txt pytest pytest-timeout mypy
          fi
      - name: Server info
        run: python server/coconut_language_server.py info
      - name: Run tests
        working-directory: server
        run: python -m pytest tests -v --timeout=420

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          python -m pip install coconut
          npm ci
          python scripts/vendor.py
      - name: Integration tests in VS Code
        run: xvfb-run -a npm run test:vscode
        env:
          COCONUT_TEST_PYTHON: python
      - name: Package
        run: npx --yes @vscode/vsce@3 package
      - uses: actions/upload-artifact@v4
        with:
          name: coconut-vsix
          path: "*.vsix"

  claude-plugin:
    name: Claude Code plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check plugin files are valid JSON with the expected fields
        run: |
          python - <<'PY'
          import json
          market = json.load(open(".claude-plugin/marketplace.json"))
          plugin = json.load(open(".claude-plugin/plugin.json"))
          lsp = json.load(open(".lsp.json"))
          mcp = plugin
          assert market["plugins"][0]["name"] == plugin["name"]
          assert lsp["coconut"]["extensionToLanguage"][".coco"] == "coconut"
          assert "coconut" in mcp["mcpServers"]
          print("ok")
          PY
